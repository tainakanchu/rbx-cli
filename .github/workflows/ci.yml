name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain (and its rustfmt/clippy) comes from rust-toolchain.toml.
      - name: Install the pinned toolchain
        run: rustup toolchain install || rustup show
      - run: cargo fmt --all -- --check

  test:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The vendored OpenSSL (SQLCipher) needs a native perl, not Git Bash's.
          "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          # Deep OpenSSL build paths exceed MAX_PATH under the workspace.
          "CARGO_TARGET_DIR=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
      - name: Install the pinned toolchain
        shell: bash
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
