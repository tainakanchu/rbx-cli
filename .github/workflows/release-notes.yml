name: Release notes

# Sets a release's notes from release-notes/<tag>.md on main, for a release
# that already exists (release.yml uses the same file when it creates one).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --notes-file "release-notes/$TAG.md"
