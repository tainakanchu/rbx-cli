name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and smoke-tests every target without creating a release.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # Cross-compiled on x64 (MSVC ships the ARM64 toolset); the binary
          # is smoke-tested on a native Arm runner by `smoke-windows-arm64`.
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      # Both macOS builds run on Apple silicon; x86_64 is cross-compiled.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "CARGO_TARGET_DIR=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          # Link the C runtime statically: no Visual C++ redistributable needed.
          "RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Install the pinned toolchain and target
        shell: bash
        run: |
          rustup toolchain install || rustup show
          rustup target add "$TARGET"

      - name: Build
        shell: bash
        # SQLCipher and OpenSSL are compiled from source and linked statically
        # (rusqlite's bundled-sqlcipher-vendored-openssl), so the binary needs
        # no system OpenSSL/SQLite.
        run: cargo build --locked --release --target "$TARGET"

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' && matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          dir="${CARGO_TARGET_DIR:-target}"
          "$dir/$TARGET/release/rbx-cli" version --json

      - name: Package
        shell: bash
        run: |
          dir="${CARGO_TARGET_DIR:-target}"
          name="rbx-cli-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$dir/$TARGET/release/rbx-cli.exe" "dist/$name/"
          else
            cp "$dir/$TARGET/release/rbx-cli" "dist/$name/"
          fi
          cp LICENSE README.md NOTICE "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rbx-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  smoke-windows-arm64:
    name: smoke test (aarch64-pc-windows-msvc, native)
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rbx-cli-aarch64-pc-windows-msvc
          path: dist
      - name: Run the ARM64 binary
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath x
          $exe = Get-ChildItem -Recurse x/rbx-cli.exe | Select-Object -First 1
          & $exe.FullName version --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Make sure it is a native ARM64 image (PE machine 0xAA64), not x64.
          $b = [IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          "machine: 0x{0:X4}" -f $machine
          if ($machine -ne 0xAA64) { throw "not an ARM64 binary" }

  release:
    name: GitHub release
    needs: [build, smoke-windows-arm64]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: rbx-cli-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A release drafted by hand (with its own notes) only gets the assets.
        # A new one takes its notes from release-notes/<tag>.md when present.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            notes="src/release-notes/$GITHUB_REF_NAME.md"
            if [ -f "$notes" ]; then
              set -- --notes-file "$notes"
            else
              set -- --generate-notes
            fi
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "rbx-cli ${GITHUB_REF_NAME#v}" \
              --verify-tag "$@"
          fi
